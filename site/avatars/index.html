<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>KoGaMa Avatars - OpenKogama</title>
<meta name="description" content="Browse archived KoGaMa avatars with live previews, animations and downloads.">
<link rel="canonical" href="https://openkogama.org/avatars/">
<meta property="og:title" content="KoGaMa Avatars - OpenKogama">
<meta property="og:description" content="Browse archived KoGaMa avatars with live previews, animations and downloads.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://openkogama.org/avatars/">
<meta property="og:site_name" content="OpenKogama">
<meta property="og:image" content="https://openkogama.org/img/icon-512.png">
<meta name="twitter:card" content="summary">
<link rel="icon" href="../favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/models.css">
<script src="../js/vendor/sql.js-httpvfs/index.js"></script>
<script type="module" src="../js/models.js"></script>
</head>
<body class="gallery" data-kind="avatars">
<header class="top">
  <a class="brand" href="../"><img src="../img/icon-192.png" alt="">OPENKOGAMA</a>
  <nav class="sections">
    <a class="button nav" href="../maps/">Maps</a>
    <a class="button nav" href="./" aria-current="page">Avatars</a>
    <a class="button nav" href="../models/">Models</a>
  </nav>
</header>
<main class="models">
  <h1>AVATARS</h1>
  <p class="summary" id="summary">Loading avatars</p>
  <form class="filters" id="filters">
    <input class="line" type="search" id="search" placeholder="Search by name" autocomplete="off">
    <select class="line" id="filter" aria-label="Source">
      <option value="">All sources</option>
      <option value="class">Classes</option>
      <option value="map">Avatars in maps</option>
      <option value="world">Avatar worlds</option>
      <option value="placed">Placed in maps</option>
      <option value="build">Build mode</option>
    </select>
    <select class="line" id="color" aria-label="Color" hidden>
      <option value="">All colors</option>
      <option value="red">Red</option>
      <option value="orange">Orange</option>
      <option value="yellow">Yellow</option>
      <option value="green">Green</option>
      <option value="blue">Blue</option>
      <option value="purple">Purple</option>
      <option value="pink">Pink</option>
      <option value="brown">Brown</option>
      <option value="black">Black</option>
      <option value="white">White</option>
      <option value="gray">Gray</option>
    </select>
    <select class="line" id="type" aria-label="Type" hidden>
      <option value="">All types</option>
      <option value="human">Human</option>
      <option value="anthro">Anthro</option>
      <option value="animal">Animal</option>
      <option value="monster">Monster</option>
      <option value="robot">Robot</option>
      <option value="zombie">Zombie</option>
      <option value="skeleton">Skeleton</option>
      <option value="ghost">Ghost</option>
      <option value="alien">Alien</option>
      <option value="mythical">Mythical</option>
      <option value="vehicle">Vehicle</option>
      <option value="object">Object</option>
    </select>
    <button class="line chip" type="button" id="map" title="Show avatars from every map" hidden><span class="label"></span><span aria-hidden="true">×</span></button>
    <button class="line favorites adult" type="button" id="adult" aria-pressed="false" hidden><span>18+</span></button>
    <button class="line favorites" type="button" id="favorites" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.3 4.4 12.9a4.8 4.8 0 0 1 6.8-6.8l.8.8.8-.8a4.8 4.8 0 0 1 6.8 6.8z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg><span>Liked</span><span class="count"></span></button>
  </form>
  <div class="grid" id="grid"></div>
  <p class="status" id="status"></p>
</main>
<footer>
  <p>Not affiliated with Multiverse ApS.</p>
</footer>
</body>
</html>
