name: locales

on:
  push:
    branches: [main]
    paths: [site/locales/**]

permissions:
  contents: write

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import json, pathlib
          codes = sorted(path.stem for path in pathlib.Path("site/locales").glob("*.json") if path.stem != "en")
          pathlib.Path("site/locales.json").write_text(json.dumps(["en", *codes]) + "\n")
          PY
          git diff --quiet site/locales.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/locales.json
          git commit -m "language list follows site/locales"
          git push
